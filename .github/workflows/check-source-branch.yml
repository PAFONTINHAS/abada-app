name: Check PR Source Branch

on:
  pull_request:
    branches:
      - main  # Aplica quando o destino da PR for a main

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar branch de origem
        run: |
          echo "Branch de origem: ${{ github.head_ref }}"
          echo "Branch de destino: ${{ github.base_ref }}"
          
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Erro: Pull requests para a 'main' só podem ser criados a partir da branch 'dev'."
            exit 1
          fi
